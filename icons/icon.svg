<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1F5A43"/>
      <stop offset=".55" stop-color="#0F3A2B"/>
      <stop offset="1" stop-color="#061C15"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8FD3FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8FD3FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DB8F2"/>
      <stop offset=".45" stop-color="#3C74CF"/>
      <stop offset="1" stop-color="#1B3A86"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9A3"/>
      <stop offset=".5" stop-color="#E9B949"/>
      <stop offset="1" stop-color="#A9761C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="262" rx="190" ry="150" fill="url(#glow)"/>

  <g transform="rotate(-14 262 270)">
    <!-- mouthpiece -->
    <path d="M150 226 L118 168 Q134 150 160 158 L196 214 Z" fill="url(#body)" stroke="url(#gold)" stroke-width="7" stroke-linejoin="round"/>
    <!-- body: sweet-potato shape, narrow left, round right -->
    <path d="M100 280 C96 236 150 206 232 200 C330 192 426 214 432 272 C438 332 350 358 264 354 C170 350 104 322 100 280 Z"
          fill="url(#body)" stroke="url(#gold)" stroke-width="8"/>
    <!-- highlight -->
    <path d="M150 246 C200 222 290 214 370 226" fill="none" stroke="#DDF1FF" stroke-width="9" stroke-linecap="round" opacity=".5"/>
    <!-- finger holes -->
    <g fill="#0E1F4D" stroke="#0A1638" stroke-width="2">
      <circle cx="222" cy="258" r="13"/>
      <circle cx="262" cy="250" r="13"/>
      <circle cx="304" cy="250" r="13"/>
      <circle cx="344" cy="258" r="13"/>
      <circle cx="384" cy="274" r="11"/>
      <circle cx="286" cy="310" r="8"/>
      <circle cx="326" cy="314" r="8"/>
    </g>
  </g>

  <!-- floating notes & sparkles -->
  <g fill="url(#gold)">
    <!-- eighth note -->
    <g transform="translate(372 110)"><ellipse cx="0" cy="44" rx="13" ry="9.5" transform="rotate(-20 0 44)"/><rect x="9" y="0" width="5" height="44"/><path d="M14 0 q4 16 20 22 q-6 -16 -20 -22z"/></g>
    <!-- quarter note -->
    <g transform="translate(130 372)"><ellipse cx="0" cy="34" rx="11" ry="8" transform="rotate(-20 0 34)"/><rect x="7.5" y="0" width="4" height="34"/></g>
    <path d="M432 150 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z"/>
    <path d="M84 206 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <path d="M380 392 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <path d="M236 126 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" opacity=".8"/>
  </g>
</svg>
